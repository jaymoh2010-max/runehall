name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify compendium and database
        run: npm run verify:data

      - name: Production build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Backup and restore drill
        run: npm run restore-drill

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t runehall:ci .

      - name: Run production container
        run: |
          docker run -d --name runehall-ci \
            -p 3001:3001 \
            -e COOKIE_SECURE=0 \
            -e REGISTRATION_MODE=open \
            runehall:ci

      - name: Wait for container health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy."
          docker logs runehall-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs runehall-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f runehall-ci || true
