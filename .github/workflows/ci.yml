name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify compendium and database
        run: npm run verify:data

      - name: Production build
        run: npm run build

      - name: Smoke test
        run: npm run smoke

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t runehall:ci .

      - name: Run production container
        run: |
          docker run -d --name runehall-ci \
            -p 3001:3001 \
            -e COOKIE_SECURE=0 \
            -e REGISTRATION_MODE=open \
            runehall:ci

      - name: Wait for container health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy."
          docker logs runehall-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs runehall-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f runehall-ci || true
