    <ellipse cx="656" cy="506" rx="16" ry="10"/>
    <ellipse cx="840" cy="202" rx="18" ry="11"/>
    <ellipse cx="1120" cy="850" rx="20" ry="12"/>
    <ellipse cx="307" cy="356" rx="16" ry="10"/>
