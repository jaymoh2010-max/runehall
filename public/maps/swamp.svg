    <path d="M520 484l-22-52M542 496l-4-58M562 504l16-54M588 498l28-40M900 228l-18-46M920 238l2-52M940 246l20-44M1180 884l-20-50M1202 892l0-56M1222 900l18-48M1246 892l26-40"/>
