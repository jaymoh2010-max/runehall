<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <pattern id="sw-water" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="#3d4c38"/>
      <path d="M0 28c22-12 44-12 66 0s40 12 62 0M-14 82c22-11 44-11 66 0s40 11 62 0M18 118c22-10 44-10 66 0s40 10 62 0" fill="none" stroke="#65775a" stroke-width="4" opacity=".45"/>
      <path d="M0 46c22-8 44-8 66 0s40 8 62 0M6 98c22-8 44-8 66 0s40 8 62 0" fill="none" stroke="#2b3929" stroke-width="3" opacity=".55"/>
      <circle cx="20" cy="64" r="2" fill="#7c9068" opacity=".5"/>
      <circle cx="92" cy="14" r="1.7" fill="#8ca377" opacity=".45"/>
    </pattern>
    <pattern id="sw-mud" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#5c5638"/>
      <path d="M5 14c12-6 22-6 32 0M30 40c10-5 18-5 28 0M12 54c8-4 14-4 22 0" fill="none" stroke="#6f6945" stroke-width="3" opacity=".6"/>
      <circle cx="16" cy="34" r="1.8" fill="#47422b" opacity=".6"/>
      <circle cx="48" cy="22" r="1.5" fill="#7b744f" opacity=".5"/>
    </pattern>
    <pattern id="sw-plank" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#6b5637"/>
      <rect y="1" width="64" height="13" fill="#7b6340"/>
      <rect y="17" width="64" height="13" fill="#5e4a2e"/>
      <path d="M0 16h64M0 31h64" stroke="#3f301c" stroke-width="2" opacity=".7"/>
      <path d="M18 2v12M46 18v12M30 2v12M54 18v12" stroke="#4f3d25" stroke-width="2" opacity=".6"/>
    </pattern>
    <radialGradient id="sw-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4d889" stop-opacity=".18"/>
      <stop offset="1" stop-color="#c4d889" stop-opacity="0"/>
    </radialGradient>
    <filter id="sw-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10170f" flood-opacity=".55"/>
    </filter>
    <filter id="sw-grain">
      <feTurbulence baseFrequency=".68" numOctaves="2" seed="44" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
    </filter>
    <filter id="sw-blur"><feGaussianBlur stdDeviation="16"/></filter>
    <radialGradient id="sw-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#0d140c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d140c" stop-opacity=".6"/>
    </radialGradient>
  </defs>

  <rect width="1536" height="1024" fill="url(#sw-water)"/>

  <!-- mud islands -->
  <g filter="url(#sw-shadow)">
    <path d="M92 168c84-84 212-92 310-48 82 36 128 118 88 186-42 72-160 110-254 88S28 292 48 228c8-26 22-44 44-60Z" fill="url(#sw-mud)" stroke="#37351f" stroke-width="7"/>
    <path d="M1080 108c96-62 252-44 336 34 64 60 72 154 0 208-88 66-232 62-316-8-72-60-84-176-20-234Z" fill="url(#sw-mud)" stroke="#37351f" stroke-width="7"/>
    <path d="M188 712c72-88 226-108 336-54 92 46 118 148 38 210-86 66-248 58-334-10-54-44-76-104-40-146Z" fill="url(#sw-mud)" stroke="#37351f" stroke-width="7"/>
    <path d="M848 636c86-74 250-72 330 8 62 62 44 168-42 214-110 60-252 24-310-56-42-58-38-124 22-166Z" fill="url(#sw-mud)" stroke="#37351f" stroke-width="7"/>
    <path d="M620 264c66-42 170-30 216 30 40 52 20 126-44 160-76 40-178 18-206-42-24-52-10-114 34-148Z" fill="url(#sw-mud)" stroke="#37351f" stroke-width="7"/>
  </g>
  <g fill="none" stroke="#788a5c" stroke-width="5" opacity=".55">
    <path d="M104 180c78-66 190-76 278-38M1100 126c88-52 218-36 296 30M206 724c68-70 196-86 294-42M866 652c76-58 216-56 292 8M634 280c56-32 142-24 184 24"/>
  </g>

