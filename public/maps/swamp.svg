      <path d="M34-170c-40-30-74-30-104-4M34-170c34-44 74-48 114-14M34-170c-2-38 16-66 48-82M18-92c-34-14-62-6-84 18M24-54c30-18 60-16 84 6" fill="none" stroke="#4a3a25" stroke-width="12" stroke-linecap="round"/>
