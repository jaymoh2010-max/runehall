      <path d="M32-146c-36-26-66-24-92 0M32-146c30-36 64-36 96-8M32-146c0-30 14-54 40-70M20-80c-28-10-52-2-70 18M26-44c26-14 52-12 72 8" fill="none" stroke="#4a3a25" stroke-width="11" stroke-linecap="round"/>
    </g>
    <g transform="translate(700 816)">
      <path d="M0 0c-2-48 10-82 26-112" fill="none" stroke="#4a3a25" stroke-width="20" stroke-linecap="round"/>
      <path d="M26-112c-28-22-52-20-72 2M26-112c24-28 52-28 78-4M26-112c0-24 12-42 30-54" fill="none" stroke="#4a3a25" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- sunken shrine -->
  <g filter="url(#sw-shadow)" transform="translate(1000 356)">
    <ellipse cx="0" cy="18" rx="142" ry="82" fill="#4b4930" opacity=".75"/>
    <rect x="-108" y="-58" width="216" height="140" fill="#5f6344" stroke="#383b25" stroke-width="7" opacity=".9"/>
    <rect x="-84" y="-34" width="168" height="92" fill="none" stroke="#7f8660" stroke-width="4"/>
    <path d="M-108-58l-26-30M108-58l26-30M-108 82l-26 30M108 82l26 30" stroke="#3d4028" stroke-width="9" stroke-linecap="round"/>
