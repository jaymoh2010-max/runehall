  <rect width="1536" height="1024" fill="url(#sw-glow)"/>
  <rect width="1536" height="1024" filter="url(#sw-grain)" opacity=".6"/>
  <rect width="1536" height="1024" fill="url(#sw-vignette)"/>
</svg>
