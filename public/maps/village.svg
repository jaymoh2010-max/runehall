      <circle cx="58" cy="58" r="1.7" fill="#8fa86c" opacity=".45"/>
    </pattern>
    <pattern id="vg-road" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#b39a6c"/>
