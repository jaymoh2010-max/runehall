    </pattern>
    <pattern id="vg-stone" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#77726a"/>
      <rect x="1" y="1" width="62" height="29" fill="#888278"/>
      <rect x="1" y="34" width="29" height="29" fill="#7f7a71"/>
      <rect x="34" y="34" width="29" height="29" fill="#918b80"/>
      <path d="M0 33h64M32 33v31" stroke="#5f5b55" stroke-width="2" opacity=".7"/>
    </pattern>
    <filter id="vg-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#241c12" flood-opacity=".5"/>
    </filter>
    <filter id="vg-grain">
      <feTurbulence baseFrequency=".6" numOctaves="2" seed="12" type="fractalNoise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
    </filter>
    <radialGradient id="vg-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#18210f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#18210f" stop-opacity=".45"/>
    </radialGradient>
  </defs>

