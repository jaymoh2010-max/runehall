<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <pattern id="vg-grass" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#617d46"/>
