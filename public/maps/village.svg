      <path d="M0 1h64" stroke="#b0694c" stroke-width="2" opacity=".55"/>
    </pattern>
    <pattern id="vg-thatch" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#a58542"/>
      <path d="M2 30l6-28M14 30l6-28M26 30l6-28M38 30l6-28M50 30l6-28M62 30l4-20" stroke="#c2a25d" stroke-width="3" opacity=".55"/>
